<style>
  :root{
    --bg:#fff; --rail:#f7f8fa; --side:#fbfbfd; --line:#eceef1; --line-2:#e3e6eb;
    --text:#1c2024; --muted:#7c828d; --muted-2:#9aa0aa; --hover:#f1f2f5;
    --cu:#7b68ee; --cu-d:#6a57e0; --grad:linear-gradient(135deg,#fd71af,#7b68ee 50%,#49ccf9);
    --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    --urgent:#e5484d; --high:#f2891b; --normal:#5b8def; --low:#b3bac5;
    --ontrack:#2bb673; --atrisk:#f2c037; --behind:#f2891b; --overdue:#e5484d; --complete:#5b8def;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  .app{font-family:var(--font);color:var(--text);background:var(--bg);height:100vh;display:flex;overflow:hidden;font-size:14px;-webkit-font-smoothing:antialiased}

  /* rail */
  .rail{width:58px;background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:6px;flex-shrink:0}
  .ws-avatar{width:34px;height:34px;border-radius:9px;background:var(--grad);color:#fff;font-weight:700;display:grid;place-items:center;font-size:15px;margin-bottom:10px;box-shadow:0 2px 6px rgba(123,104,238,.4)}
  .rail-btn{width:38px;height:38px;border-radius:9px;border:none;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:.12s}
  .rail-btn:hover{background:var(--hover);color:var(--text)}
  .rail-btn.active{background:#eceaff;color:var(--cu)}
  .rail-btn svg{width:19px;height:19px}
  .rail-spacer{flex:1}

  /* sidebar */
  .side{width:256px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
  .side-head{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
  .side-head .ws-name{font-weight:700;font-size:15px;display:flex;align-items:center;gap:7px}
  .side-head .ws-sub{font-size:12px;color:var(--muted);margin-top:2px}
  .nav-item{display:flex;align-items:center;gap:9px;margin:8px 8px 0;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13.5px;font-weight:500}
  .nav-item:hover{background:var(--hover)}
  .nav-item.active{background:#eceaff;color:var(--cu);font-weight:600}
  .nav-item svg{width:16px;height:16px}
  .side-section .lbl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-2);padding:14px 16px 4px}
  .spaces{overflow-y:auto;flex:1;padding:0 8px}
  .space{margin:1px 0}
  .space-row{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;cursor:pointer}
  .space-row:hover{background:var(--hover)}
  .space-row.active{background:#eceaff}
  .space-row.active .space-name{color:var(--cu);font-weight:600}
  .caret{width:14px;color:var(--muted-2);font-size:10px;transition:.15s;text-align:center}
  .space.open .caret{transform:rotate(90deg)}
  .space-icon{width:22px;height:22px;border-radius:6px;color:#fff;font-weight:700;font-size:11px;display:grid;place-items:center;flex-shrink:0}
  .space-name{font-size:13.5px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .space-count{font-size:11px;color:var(--muted-2);background:#fff;border:1px solid var(--line-2);border-radius:10px;padding:0 7px;line-height:17px}
  .projlist{display:none;padding:2px 0 4px}
  .space.open .projlist{display:block}
  .proj-row{display:flex;align-items:center;gap:8px;padding:5px 8px 5px 30px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--muted)}
  .proj-row:hover{background:var(--hover);color:var(--text)}
  .proj-row .pdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .proj-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* main */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{padding:14px 22px 0;border-bottom:1px solid var(--line)}
  .crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  .crumb .sp{width:18px;height:18px;border-radius:5px;color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
  .crumb .cur{color:var(--text);font-weight:600;font-size:15px}
  .crumb .sep{color:var(--muted-2)}
  .title-row{display:flex;align-items:center;justify-content:space-between;margin:10px 0 6px}
  .title-row h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}
  .title-actions{display:flex;gap:8px}
  .pill-btn{border:1px solid var(--line-2);background:#fff;border-radius:7px;padding:6px 12px;font-size:13px;font-weight:500;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:6px}
  .pill-btn:hover{background:var(--hover)}
  .pill-btn.primary{background:var(--cu);border-color:var(--cu);color:#fff}
  .pill-btn.primary:hover{background:var(--cu-d)}
  .tabs{display:flex;gap:2px;margin-top:8px}
  .tab{padding:9px 14px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--cu);border-bottom-color:var(--cu);font-weight:600}
  .tab svg{width:15px;height:15px}
  .toolbar{display:flex;align-items:center;gap:10px;padding:11px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .search{position:relative;display:flex;align-items:center}
  .search svg{position:absolute;left:9px;width:15px;height:15px;color:var(--muted-2)}
  .search input{border:1px solid var(--line-2);border-radius:7px;padding:7px 10px 7px 30px;font-size:13px;font-family:var(--font);width:200px}
  .search input:focus{outline:none;border-color:var(--cu)}
  .fsel{font-family:var(--font);font-size:13px;border:1px solid var(--line-2);border-radius:7px;padding:7px 10px;background:#fff;cursor:pointer}
  .fsel:focus{outline:none;border-color:var(--cu)}
  .tspacer{flex:1}
  .content{flex:1;overflow:auto;padding:0 0 60px}

  .sample-note{margin:12px 22px 0;background:#fff7ed;border:1px solid #fae0bd;color:#92600d;font-size:12.5px;padding:9px 12px;border-radius:8px}

  /* summary */
  .sumwrap{padding:18px 22px}
  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:8px}
  .scard{background:#fff;border:1px solid var(--line-2);border-radius:11px;padding:14px 16px}
  .scard .n{font-size:26px;font-weight:700;line-height:1}
  .scard .l{font-size:12.5px;color:var(--muted);margin-top:5px;display:flex;align-items:center;gap:6px}
  .scard .l .d{width:8px;height:8px;border-radius:50%}
  .sec-title{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-2);margin:24px 0 12px}
  .co-grid {display: grid;grid-template-columns: 1fr 1fr; /* HARD FORCE 2 columns */gap: 16px;align-items: stretch;}

@media (max-width: 900px){
  .co-grid{
    grid-template-columns: 1fr;
  }
}

  .group-head{display:flex;align-items:center;gap:9px;padding:10px 22px;cursor:pointer;user-select:none}

  .dr-tabs{display:flex;gap:4px;margin-top:14px}
  .dr-tab{padding:9px 12px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}

  .dr-body{padding:20px 22px;overflow-y:auto;flex:1}

  .rng{display:flex;align-items:center;gap:10px}
  .rng input{flex:1}
  .save-row{display:flex;align-items:center;gap:10px;margin-top:4px}

  /* governance */
  .gov-overall{display:flex;align-items:center;gap:12px;margin-bottom:18px;font-size:13px}
  .gov-overall .bar{flex:1;height:8px;background:var(--line-2);border-radius:5px;overflow:hidden}

  .gstage{margin-bottom:16px;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
  .gstage-h{padding:10px 14px;background:var(--side);font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px}
  .gstage-h .num{width:20px;height:20px;border-radius:50%;background:var(--cu);color:#fff;font-size:11px;display:grid;place-items:center;font-weight:700}
  .gstage-h .cur-tag{margin-left:auto;font-size:10px;font-weight:700;color:var(--cu);background:#eceaff;padding:2px 8px;border-radius:5px}
  .gitem{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
  .gitem .gname{flex:1;font-size:13.5px}

<script>
// ---------------- config ----------------
const STAGES = [
  {id:"initiation", label:"Initiation"},
  {id:"planning", label:"Planning"},
  {id:"execution", label:"Execution / Development"},
  {id:"qa", label:"Quality Assurance"},
  {id:"uat", label:"User Acceptance Testing"},
  {id:"closure", label:"Project Closure"},
];
const STAGE_IDX = Object.fromEntries(STAGES.map((s,i)=>[s.id,i]));
const GOVERNANCE = [
  {id:"boscard", label:"BOSCARD", stage:"initiation"},
  {id:"brd", label:"Business Requirements Document (BRD)", stage:"planning"},
  {id:"plan", label:"Project Plan / Gantt / Development Plan", stage:"planning"},
  {id:"qa", label:"QA Testing Report", stage:"qa"},
  {id:"uat", label:"UAT Sign-offs", stage:"uat"},
  {id:"golive", label:"Go-live Change Request Sign-off", stage:"closure"},
  {id:"closure", label:"Closure Report Sign-off", stage:"closure"},
];
const HEALTH = {
  ontrack:{label:"On Track", color:"#2bb673"},
  atrisk:{label:"At Risk", color:"#f2c037"},
  behind:{label:"Behind Schedule", color:"#f2891b"},
  overdue:{label:"Overdue", color:"#e5484d"},
  complete:{label:"Complete", color:"#5b8def"},
};
const GOV_ST = {pending:{l:"Pending",c:"#8d96a3"}, progress:{l:"In progress",c:"#5b8def"}, signed:{l:"Signed off",c:"#2bb673"}, na:{l:"N/A",c:"#c2c7d0"}};
const PRIO = {urgent:"#e5484d", high:"#f2891b", normal:"#5b8def", low:"#b3bac5"};
const AV=["#7b68ee","#2bb673","#f2891b","#5b8def","#e5484d","#12b5c9","#e0568a"];
const TODAY = "2026-06-15";

// ---------------- seed ----------------
function seedGov(stage, complete){
  const si = STAGE_IDX[stage], g={};
  GOVERNANCE.forEach(it=>{
    const gi = STAGE_IDX[it.stage];
    g[it.id] = complete ? "signed" : gi<si ? "signed" : gi===si ? "progress" : "pending";
  });
  return g;
}

// ---------------- storage ----------------

async function load() {

  try {
    const res = await fetch("../api/projects.php");
    const json = await res.json();

    const projects = json.data;

    // Group into Business Units
    const map = {};

    projects.forEach(p => {

      if (!map[p.business_unit]) {
        map[p.business_unit] = {
          id: p.business_unit.toLowerCase(),
          name: p.business_unit,
          color: getColor(p.business_unit),
          projects: []
        };
      }

      map[p.business_unit].projects.push({
        id: p.id,
        company: p.business_unit.toLowerCase(),
        companyName: p.business_unit,
        companyColor: getColor(p.business_unit),

        name: p.name,
        stage: p.stage,
        health: p.status,
        owner: p.owner,
        prio: p.priority,

        gateDue: p.gate_due,
        compDue: p.completion_due,

        progress: parseInt(p.progress || 0),

        currentUpdate: p.current_update || "",
        nextSteps: p.next_steps || "",

        governance: {} // phase 2 later
      });

    });

    DATA = Object.values(map);

  } catch (err) {
    console.error("Failed to load projects:", err);
    DATA = [];
  }
}

async function saveProject(p) {

  await fetch("../api/saveProject.php", {

    },

      id: p.id,

}

const $=id=>document.getElementById(id);
const co=id=>DATA.find(c=>c.id===id);
const allProjects=()=>DATA.flatMap(c=>c.projects);
function findP(id){for(const c of DATA)for(const p of c.projects)if(p.id===id)return p; return null;}
function avC(i){let s=0;for(const ch of i)s+=ch.charCodeAt(0);return AV[s%AV.length];}
function esc(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function fmt(d){if(!d)return "—";return new Date(d+"T00:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric",year:"2-digit"});}
function flag(p){return `<svg class="flag" viewBox="0 0 24 24" fill="${PRIO[p]}"><path d="M5 3v18M5 4h12l-2 4 2 4H5"/></svg>`;}
function av(i){return `<span class="avatar" style="background:${avC(i)}">${esc(i)}</span>`;}
function effStatus(p){ if(p.health==="complete")return "complete"; if(p.compDue && p.compDue<TODAY)return "overdue"; return p.health; }
function gateOverdue(p){ return p.gateDue && p.gateDue<TODAY && effStatus(p)!=="complete"; }
function govPct(p){ const items=GOVERNANCE.filter(g=>p.governance[g.id]!=="na"); if(!items.length)return 100; const signed=items.filter(g=>p.governance[g.id]==="signed").length; return Math.round(signed/items.length*100); }

function getFiltered(scope){
  const q=($("search")?.value||"").trim().toLowerCase();
  const fst=$("fStatus")?.value||"";
  const fco=$("fCompany")?.value||"";
  return scope.filter(p=>{
    if(q && !p.name.toLowerCase().includes(q)) return false;
    if(fst && effStatus(p)!==fst) return false;
    if(fco && p.company!==fco) return false;
    return true;
  });
}

// ---------------- summary builder ----------------
function statBlock(projs){
  const c={ontrack:0,atrisk:0,behind:0,overdue:0,complete:0};
  projs.forEach(p=>c[effStatus(p)]++);
  const avg = projs.length ? Math.round(projs.reduce((a,p)=>a+p.progress,0)/projs.length) : 0;
  return {c, avg, total:projs.length};
}
function segBar(c,total){
  if(!total) return `<div class="segbar"></div>`;
  return `<div class="segbar">`+["complete","ontrack","atrisk","behind","overdue"].map(k=>c[k]?`<i style="width:${c[k]/total*100}%;background:${HEALTH[k].color}" title="${HEALTH[k].label}: ${c[k]}"></i>`:"").join("")+`</div>`;
}

function ringChart(counts, total) {

  if (!total) {
    return `<div class="ring-wrap"><div class="ring-center">0%</div></div>`;
  }

  const segments = [
    { key: "complete", color: "#5b8def", label: "Complete" },
    { key: "ontrack", color: "#2bb673", label: "On Track" },
    { key: "atrisk", color: "#f2c037", label: "At Risk" },
    { key: "behind", color: "#f2891b", label: "Behind" },
    { key: "overdue", color: "#e5484d", label: "Overdue" }
  ];

  let offset = 0;
  let circles = "";

  segments.forEach(seg => {
    const value = counts[seg.key] || 0;
    const percent = value / total;
    const dash = percent * 100;

    circles += `
      <circle
        r="26"
        cx="36"
        cy="36"
        fill="transparent"
        stroke="${seg.color}"
        stroke-width="10"
        stroke-dasharray="${dash} ${100 - dash}"
        stroke-dashoffset="-${offset}">
        <title>${seg.label}: ${value}</title>
      </circle>
    `;

    offset += dash;
  });

  const completePct = Math.round((counts.complete / total) * 100);

  return `
    <div class="ring-wrap">
      <svg viewBox="0 0 72 72" class="ring">
        ${circles}
      </svg>
      <div class="ring-center">${completePct}%</div>
    </div>
  `;
}

async function checkAlerts() {

  const res = await fetch("../api/alerts.php");
  const data = await res.json();

  data.forEach(p => {
    console.warn("OVERDUE:", p.name);

    showToast(`Overdue: ${p.name}`);
  });
}


function showToast(msg) {
  const div = document.createElement("div");

  div.textContent = msg;

  div.style = `
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #e5484d;
    color: white;
    padding: 10px 15px;
    border-radius: 6px;
  `;

  document.body.appendChild(div);

  setTimeout(() => div.remove(), 4000);
}
setInterval(checkAlerts, 60000); // every 1 min

function renderGantt(projects) {

  const tasks = projects.map(p => ({
    id: p.id,
    name: p.name,
    start: p.gateDue,
    end: p.compDue,
    progress: p.progress
  }));

  document.getElementById("content").innerHTML = `<svg id="gantt"></svg>`;

  new Gantt("#gantt", tasks);
}

  await fetch("../api/sendEmail.php");
}

function renderTimeline(data) {
  return data.map(a => `
    <div>${a.created_at} - ${a.action}</div>
  `).join("");
}
